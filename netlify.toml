# Netlify Build Configuration for Chakra Sound Meditation App

[build]
  command = "npm run build"
  publish = "dist"

# Headers for caching and security
[[headers]]
  for = "/*"
  [headers.values]
    # Cache static assets but allow revalidation
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    # Cache built assets for 1 year
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    # Cache CSS but allow revalidation
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.js"
  [headers.values]
    # Cache JS but allow revalidation
    Cache-Control = "public, max-age=0, must-revalidate"

# Redirect rules for SPA
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Environment variables for build
[build.environment]
  NODE_VERSION = "18"
